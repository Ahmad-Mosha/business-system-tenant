# Deployment. Caddy terminates TLS and gets a certificate automatically, which
# is what Easy Orders needs to deliver webhooks to a real HTTPS address.
#
#   DOMAIN=your.domain docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: primemarket
    volumes: ["pmdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d primemarket"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://prime:${POSTGRES_PASSWORD}@db:5432/primemarket
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      API_PORT: 3001
      BOSTA_KEY: ${BOSTA_KEY:-}
      EASY_ORDER_KEY: ${EASY_ORDER_KEY:-}
      EASYORDERS_WEBHOOK_SECRET: ${EASYORDERS_WEBHOOK_SECRET:-}
      EASYORDERS_STORE_ID: ${EASYORDERS_STORE_ID:-}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  pmdata:
  caddydata:
