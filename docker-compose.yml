services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime
      POSTGRES_DB: prime_market
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d prime_market"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
