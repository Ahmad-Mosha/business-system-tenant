services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime
      POSTGRES_DB: primemarket
    # 5434 — the previous build's database is still on 5433 and is left alone.
    ports: ["5434:5432"]
    volumes: ["pmdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d primemarket"]
      interval: 5s
      retries: 10
volumes:
  pmdata:
